note: Drupal’s data model is configurable per installation — bundles, fields and vocabularies are site-defined.
  What follows is the CORE entity graph that every Drupal site shares, derived from the schemas in openapi/. Site-specific
  fields are deliberately not enumerated, because they do not exist until an operator creates them.
