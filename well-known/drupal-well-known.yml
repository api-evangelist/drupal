probe_note: 'IMPORTANT METHOD NOTE. A first pass with a Chrome User-Agent returned HTTP 200 and a 3,038-byte F5
  "Client Challenge" page for EVERY path on EVERY drupal.org host, including the site root — which would have been
  recorded as either a wall or, worse, as served documents. Re-probing with a plain non-browser User-Agent returned
  the true responses: honest 404s on www.drupal.org, and four REAL discovery documents on accounts.drupal.org and
  git.drupalcode.org. The edge challenges browser-shaped clients and lets machine clients through, which is the
  reverse of the usual pattern. Probe both ways before concluding.'
