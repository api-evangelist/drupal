  evidence: No application/problem+json response is declared anywhere in openapi/. Errors use the JSON:API errors[]
    envelope (status/title/detail/source.pointer) instead, which is the correct choice for a JSON:API surface but
    is not RFC 9457
- id: pagination
  name: Cursor/offset pagination
  conforms: true
  evidence: JsonApiCollectionLinks declares self/first/prev/next/last; JSON:API page[offset]/page[limit] query parameters
- id: idempotency
