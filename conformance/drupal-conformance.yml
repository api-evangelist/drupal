compliance_certifications:
  published: false
  note: Drupal is a project and a 501(c)(3) association, not a hosted service operator, so it publishes no SOC 2
    / ISO 27001 / PCI attestation of its own — compliance belongs to whoever hosts a given Drupal site. What the
    project does publish is a coordinated security team, a disclosure policy and a dated advisory feed (see security/
    and lifecycle/). No Compliance pointer is emitted, because no certification exists to point at.
