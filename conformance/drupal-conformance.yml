domain_standard:
  id: jsonapi-1.0
  name: JSON:API v1.0
  conforms: true
  market: content management / headless CMS
  evidence: openapi/*.yml declares request and response content type application/vnd.api+json (43 occurrences across
    5 specs); components.schemas.JsonApiErrorResponse carries jsonapi.version example "1.0"; resource objects use
    the JSON:API type/id/attributes/relationships envelope and collection links self/first/prev/next/last.
  docs: https://www.drupal.org/docs/core-modules-and-themes/core-modules/jsonapi-module/api-overview
  note: 'This is the load-bearing one: a client that already speaks JSON:API integrates with any Drupal site with
    no bespoke connector, because the JSON:API module implements the spec rather than a house dialect.'
conformance:
- id: jsonapi
  name: JSON:API v1.0
  conforms: true
  evidence: application/vnd.api+json throughout openapi/; jsonapi.version "1.0" in the error envelope
- id: oauth2
  name: OAuth 2.0 (RFC 6749) authorization code
  conforms: true
  evidence: components.securitySchemes.oAuth2 with an authorizationCode flow in openapi/drupal-*-openapi.yml; supplied
    by drupal/simple_oauth 6.1.1
- id: oidc
  name: OpenID Connect
  conforms: true
  evidence: drupal/simple_oauth is titled "Simple OAuth (OAuth2) & OpenID Connect" and ships an OIDC provider; note
