naftiko: 1.0.0-alpha2
info:
  label: Drupal JSON:API — Users
  description: 'Drupal JSON:API — Users. 3 operations. Lead operation: List users. Self-contained Naftiko capability covering
    one Drupal business surface.'
  tags:
  - Drupal
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DRUPAL_API_KEY: DRUPAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: jsonapi-users
    baseUri: https://example.com/jsonapi
    description: Drupal JSON:API — Users business capability. Self-contained, no shared references.
    resources:
    - name: user-user
      path: /user/user
      operations:
      - name: listusers
        method: GET
        description: List users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: user-user-uuid
      path: /user/user/{uuid}
      operations:
      - name: getuser
        method: GET
        description: Get a user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateuser
        method: PATCH
        description: Update a user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.DRUPAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: jsonapi-users-rest
    port: 8080
    description: REST adapter for Drupal JSON:API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/user/user
      name: user-user
      description: REST surface for user-user.
      operations:
      - method: GET
        name: listusers
        description: List users
        call: jsonapi-users.listusers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/user/user/{uuid}
      name: user-user-uuid
      description: REST surface for user-user-uuid.
      operations:
      - method: GET
        name: getuser
        description: Get a user
        call: jsonapi-users.getuser
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateuser
        description: Update a user
        call: jsonapi-users.updateuser
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: jsonapi-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Drupal JSON:API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-users
      description: List users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: jsonapi-users.listusers
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user
      description: Get a user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: jsonapi-users.getuser
      outputParameters:
      - type: object
        mapping: $.
    - name: update-user
      description: Update a user
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: jsonapi-users.updateuser
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
