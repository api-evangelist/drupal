note: 'Drupal core and every contributed module on drupal.org are free software under the GPL-2.0-or-later. There
  is no vendor, no metered API, no signup gate and no paid tier for the software or for any of the API surfaces
  in this repo. Cost on a Drupal project is hosting and labour, neither of which the project sells. The Drupal Association
  takes donations and sells DrupalCon tickets and drupal.org supporting-partner placements; none of those are a
  plan attached to an API. Recording plan_count: 0 is the accurate answer, not a gap.'
