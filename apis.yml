apis:
- aid: drupal:drupalorg-api
  name: Drupal.org REST API
  description: 'The read-only REST API the Drupal Association operates on drupal.org itself, exposing Drupal.org’s
    own nodes, users, comments and taxonomy terms as JSON or XML. This is the only Drupal API served from a host
    the project controls — every other surface in this record is software you install and run on your own domain.
    Probed live 2026-09-17: /api-d7/node.json, /api-d7/user.json, /api-d7/comment.json and /api-d7/taxonomy_term.json
    all returned 200 application/json; /api-d7/file.json returned 403 (files are addressed individually as /api-d7/file/{fid}.json).'
  humanURL: https://www.drupal.org/drupalorg/docs/api
  baseURL: https://www.drupal.org/api-d7
  tags:
