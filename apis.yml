description: 'Drupal is an open-source content management system written in PHP, used to build websites, applications
  and digital experiences for individuals, organizations, governments and enterprises worldwide. It is self-hosted
  software rather than a hosted service: Drupal core ships a JSON:API v1.0 surface and a RESTful Web Services surface
  that run on the operator’s own domain, and contributed modules add GraphQL and an MCP server. The Drupal Association
  itself operates one public read-only API, the Drupal.org REST API at https://www.drupal.org/api-d7, alongside
  a machine-readable release-history feed and a Composer package repository.'
