- aid: drupal:graphql
  name: Drupal GraphQL API
  tags:
  - CMS
  - Content Management
  - GraphQL
  - Headless
  - Query Language
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://example.com/graphql
  humanURL: https://www.drupal.org/docs/contributed-modules/graphql
  properties:
  - url: https://www.drupal.org/docs/contributed-modules/graphql
    type: Documentation
  - url: https://drupal-graphql.gitbook.io/graphql/
    type: Documentation
  - url: graphql/drupal-graphql.md
    type: GraphQL
  description: >-
    The Drupal GraphQL module is a contributed module that enables developers to craft and expose a GraphQL
    schema for Drupal 10 and 11, allowing client applications to query Drupal content and entities using
    GraphQL syntax. It supports both queries and mutations for reading and writing data, and includes
    a built-in GraphiQL Explorer interface at /graphql/explorer for interactive schema browsing and query
    development.
