note: 'A crosswalk normally binds named MCP tools to backing OpenAPI operationIds. That binding CANNOT be made for
  Drupal, and the reason is a property of the product rather than a gap in this pass: drupal/mcp_server exposes
  whichever Tool API plugins a site administrator selects at /admin/config/services/mcp-server/tools, so there is
  no canonical tool list to bind. No tool names are invented here. What is recorded is the REST surface a site operator
  would be binding INTO, so the crosswalk can be completed against a specific installation.'
